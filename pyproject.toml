[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvscreener"
version = "1.0.0"
description = "AI-Powered CV Screener - bilingual RAG over synthetic CVs, running fully on local Ollama"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
